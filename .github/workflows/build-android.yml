
name: Build ORVEX Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvex-android-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ORVEX Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ORVEX
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify project files
        shell: bash
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f settings.gradle || test -f settings.gradle.kts

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle Wrapper is missing."
            exit 1
          fi

      - name: Build ORVEX APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --build-cache \
            :app:assembleDebug \
            -x lint \
            -x test 2>&1 | tee "$RUNNER_TEMP/orvex-gradle.log"

      - name: Prepare APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/ORVEX-1.2-debug.apk

      - name: Upload ORVEX APK
        uses: actions/upload-artifact@v4
        with:
          name: ORVEX-1.2-Android-APK
          path: output/ORVEX-1.2-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORVEX-build-diagnostics
          path: ${{ runner.temp }}/orvex-gradle.log
          if-no-files-found: ignore
          retention-days: 7